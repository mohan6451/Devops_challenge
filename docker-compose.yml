 services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sensor_backplane

  inference_worker:
    build: .
    command: ["python", "inference_worker/worker.py"]
    environment:
      ENGINE_PATH: /app/models/eo_detector_fp16.engine
      MANIFEST_PATH: /app/models/manifest.json
      TRT_CACHE_DIR: /tmp/trt_cache
      WORKER_PORT: "9000"
    volumes:
      - ./models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/status', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 2
    networks:
      - sensor_backplane

  vision_api:
    build: .
    command: ["python", "vision_api/app.py"]
    environment:
      APP_PORT: "8000"
      WORKER_URL: "http://inference_worker:9000"
      DB_HOST: "postgres"
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "8000:8000"
    depends_on:
      inference_worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - edge_dmz
      - sensor_backplane

 networks:
  edge_dmz:
    driver: bridge
  sensor_backplane:
    driver: bridge
    internal: true
